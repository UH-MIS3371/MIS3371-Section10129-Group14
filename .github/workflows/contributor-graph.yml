name: Update Team Activity

on:
  push:
    branches:
      - main
    paths-ignore:
      - "Assets/team-activity.svg"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: team-activity
  cancel-in-progress: true

jobs:
  update-activity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate team activity graph
        run: python .github/scripts/team_activity.py

      - name: Commit updated activity graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Assets/team-activity.svg

          if git diff --cached --quiet; then
            echo "Activity graph is already up to date."
          else
            git commit -m "Update team activity graph"
            git pull --rebase origin main
            git push
          fi
