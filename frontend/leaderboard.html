<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaderboard – MarketStreet</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <script src="auth.js" defer></script>
    <script src="data.js" defer></script>
    <script src="data/scenarios.js" defer></script>
    <script src="app.js" defer></script>
    <script src="layout.js" defer></script>
    <script src="leaderboard.js" defer></script>
  </head>

  <body data-shell="app" data-nav="leaderboard">
    <main class="page">
      <div class="page-head">
        <div>
          <h1>Leaderboard</h1>
          <p>Each player's best finished game in each challenge, ranked by return. Players appear by display name, never by email.</p>
        </div>
        <a class="btn primary" href="scenarios.html">Play a challenge</a>
      </div>

      <section class="panel flush" aria-labelledby="boardScenarioName">
        <div class="panel-head">
          <h2 id="boardScenarioName"></h2>
          <div class="segmented" role="group" aria-label="Challenge" id="boardTabs"></div>
        </div>
        <div class="table-wrap" style="margin-top: 8px">
          <table class="stack-sm">
            <thead><tr><th>Rank</th><th>Player</th><th class="num">Return</th><th class="num">Stars</th><th class="num">Finished</th></tr></thead>
            <tbody id="boardRows"></tbody>
          </table>
        </div>
        <p id="boardMessage" class="empty"></p>
        <p class="pager">★ made a profit · ★★ also beat the bot · ★★★ also beat the market</p>
      </section>
    </main>
  </body>
</html>
